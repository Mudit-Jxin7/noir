name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-22.04
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build-and-upload:
    name: ${{ matrix.artifact }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: aarch64-apple-darwin
            rustflags: ""
          - os: macos-14
            target: x86_64-apple-darwin
            artifact: x86_64-apple-darwin
            rustflags: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: x86_64-unknown-linux-gnu
            rustflags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_DIR: target
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        run: |
          ARCHIVE="noir-${GITHUB_REF_NAME}-${{ matrix.artifact }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "${ARCHIVE}" noir
          echo "ARCHIVE=${ARCHIVE}" >> "${GITHUB_ENV}"
          ls -lh "${ARCHIVE}"
          file "target/${{ matrix.target }}/release/noir" || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
