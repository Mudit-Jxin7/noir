[package]
name = "noir"
version = "0.4.0"
edition = "2021"
description = "Lightweight terminal IDE: clickable tree, read-only viewer, embedded shell/Codex"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ignore = "0.4"
notify = "7"
portable-pty = "0.8"
ratatui = "0.29"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
vt100 = "0.15"
walkdir = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
